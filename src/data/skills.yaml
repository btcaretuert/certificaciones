# Vocabulario canonico de competencias.
#
# El campo `skills` de cada ficha guarda las etiquetas TAL COMO las emitio la
# plataforma o las escribio el dueno en la hoja: son evidencia y no se tocan.
# Este archivo las agrupa. Traducir 392 etiquetas —271 de un solo uso, con
# duplicados bilingues (Liderazgo/Leadership, Python/Python (Programming
# Language))— en un puñado de competencias es lo que convierte volumen en
# senal; un filtro con 392 opciones es el mismo ruido que se quiso eliminar.
#
# La correspondencia se aplica en build, no en los YAML, por tres razones:
# no se pierde el dato original, el mapeo se audita en un solo archivo, y
# reagrupar no obliga a reescribir 246 fichas.
#
# `match` compara en minusculas y sin acentos. `patterns` son expresiones
# regulares sobre esa misma forma normalizada, para familias enteras.
# Una etiqueta puede caer en varias competencias: son facetas, no categorias.

competencias:
  # ── Datos y analitica ────────────────────────────────────────────────
  - slug: big-data
    es: Big data
    en: Big data
    area: datos-y-analitica
    match: [big data, big data analytics, analisis de big data, big data & analytics, hadoop, spark, apache spark]
    patterns: ['\bhadoop\b', '\bspark\b', '\bhdfs\b', '\bmapreduce\b', '\byarn\b', '\bhive\b', '\bhbase\b', '\bcassandra\b', '\bpig\b', '\bpresto\b', '\bdrill\b', '\bphoenix\b', '\boozie\b', '\bzookeeper\b', '\bmesos\b', '\bambari\b', '\bhue\b']

  - slug: analitica-de-datos
