# Correspondencia tecnologia -> competencia.
#
# Necesaria porque los 29 cursos de Udemy no traen etiquetas de competencia:
# su unica senal estructurada es `tech`. Sin esto, 11 fichas —justo las mas
# tecnicas del corpus— quedarian fuera de la vista por competencias.
tecnologias:
  big-data: [big-data]
  hadoop: [big-data]
  spark: [big-data]
  analitica: [analitica-de-datos]
  splunk: [analitica-de-datos]
  sql: [analitica-de-datos, bases-de-datos]
  nosql: [bases-de-datos]
  mongodb: [bases-de-datos]
  data-warehouse: [ingenieria-de-datos]
  etl: [ingenieria-de-datos]
  dbt: [ingenieria-de-datos]
  kafka: [ingenieria-de-datos]
  apache-beam: [ingenieria-de-datos]
  airflow: [ingenieria-de-datos]
  arquitectura: [ingenieria-de-datos]
  data-governance: [gobierno-de-datos]
  machine-learning: [machine-learning]
  ia-generativa: [inteligencia-artificial]
  llm-genai: [inteligencia-artificial]
  gcp: [cloud]
  aws: [cloud]
  azure: [cloud]
  firebase: [cloud]
  kubernetes: [contenedores]
  docker: [contenedores]
  devops: [devops]
  terraform: [devops]
  gitlab: [devops]
  git: [devops]
  linux: [linux-y-sistemas]
  seguridad: [ciberseguridad]
  python: [programacion]
  api: [apis-e-integracion]
  postman: [apis-e-integracion]
  json: [apis-e-integracion, bases-de-datos]
  office-365: [ofimatica-y-colaboracion]
  excel: [ofimatica-y-colaboracion]
  power-automate: [ofimatica-y-colaboracion]
  agile: [agilidad]
  scrum: [agilidad]
  six-sigma: [mejora-de-procesos]
  itil: [mejora-de-procesos]
