# Actualizaciones de dependencias. El proyecto no tiene ningun secreto, asi que
# el riesgo de la cadena de suministro no es el robo de credenciales sino que
# una version comprometida se lleve al artefacto lo que la curaduria retuvo.
# Por eso las actualizaciones llegan como PR y pasan por CI, nunca solas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Un PR por grupo: 20 PR sueltos se revisan peor que 2.
      astro:
        patterns: ['astro', '@astrojs/*']
      pruebas:
        patterns: ['@playwright/*', 'playwright', 'vitest', '@axe-core/*', 'lighthouse']
    ignore:
      # Bloquea el salto de major: @astrojs/check@0.9.10 exige typescript ^5||^6.
      # Reabrir a mano cuando @astrojs/check soporte TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
